[project]
name = "company-brain"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "openpyxl>=3.1",
    "markitdown[all]>=0.0.1a2",
    "anthropic>=0.39",
    "openai>=1.0",
    "sentence-transformers>=3.0",
    "neo4j>=5.20",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["src"]
markers = ["integration: tests needing Neo4j or model downloads"]
addopts = "-ra"
